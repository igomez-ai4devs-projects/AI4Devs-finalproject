# ===================================
# Docker Compose — E2E / ACCEPTANCE DATABASE
# ===================================
# Starts an ephemeral PostgreSQL 18 (no persistent volume) so every acceptance
# run starts from a clean database. There is no separate SMTP sink here — the
# email/notification feature this product's Mailpit service supported does not
# exist in Sport ITSM.
#
# `apps/api-e2e` and `apps/web-e2e` both exist (T-C10-06 is closed). This stack
# is exercised by `apps/api-e2e`'s Nx targets only — `pnpm nx e2e api-e2e`
# brings it up (`e2e-db-up`), runs the real migration chain against it
# (`e2e-migrate`, `pnpm migration:run` — a no-op today, until T-C10-17 adds the
# first migration), serves the API under test against it, and always tears it
# down afterwards (`tools/e2e/teardown-after.mjs`), success or failure. See
# `apps/api-e2e/project.json` and
# `.claude/skills/ci-cd/references/database.md`. `apps/web-e2e` does not use a
# database directly — it drives the web client, not the API — so it never
# touches this stack.
#
# Usage (manual, for local debugging only — `pnpm nx e2e api-e2e` manages this
# stack's full lifecycle on its own and needs neither of these commands run by
# hand):
#   Up:   docker compose -f docker/docker-compose.e2e.yml up -d --wait
#   Down: docker compose -f docker/docker-compose.e2e.yml down -v
#
# Port 5499 is deliberately offset from the dev stack's 5432 so both can run
# at the same time.
#
# `name`: see the equivalent note in docker-compose.dev.yml — without an
# explicit project name this file would share one with the dev stack (both
# live in `docker/`), and tearing this stack down would take the dev
# database's volume with it.
# ===================================
name: sport-itsm-e2e

services:
  postgres-e2e:
    image: postgres:18.6
    container_name: sport-itsm-postgres-e2e
    ports:
      - '5499:5432'
    environment:
      POSTGRES_DB: sport_itsm_e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # No volume: the database is ephemeral and is destroyed on `down`.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d sport_itsm_e2e']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: 'no'
    networks:
      - e2e-network

networks:
  e2e-network:
    driver: bridge
