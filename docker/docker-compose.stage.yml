# ===================================
# Docker Compose — STAGE IMAGE BUILD DEFINITION
# ===================================
# Sport ITSM deploys to Render, stage only, from prebuilt ghcr.io images —
# ADR-013 in docs/product/ARCHITECTURE.md §10 (readme.md §2.4 is the
# human-readable topology). This file's purpose follows from that decision:
# it is no longer a description of how stage *runs* — Render is — it is the
# **image build (and push) definition** the pipeline drives.
#
# Both applications must already be built before this file is used:
# `pnpm nx build api --configuration=production` and `pnpm nx build web`
# produce `dist/apps/api` and `dist/apps/web/browser`. Both Dockerfiles are
# runtime-only (no build stage inside the image), so `docker compose build`
# against this file only packages what already exists on disk.
#
# `.github/workflows/deploy-stage.yml` drives this file two ways:
#   docker compose -f docker/docker-compose.stage.yml build   # tags with `image:`
#   docker compose -f docker/docker-compose.stage.yml push    # to ghcr.io
# Neither command uses `ports`, `healthcheck`, `depends_on` or `restart` —
# they are kept anyway, see the note below.
#
# It correctly has no `postgres` service: ADR-015 (the stage prototype,
# docs/product/ARCHITECTURE.md §10, decision 4) removed PostgreSQL from
# stage entirely — the API runs PERSISTENCE_MODE=memory below, and the web
# service reverse-proxies /api/ to it (T-C10-79) — so there is no database,
# managed or otherwise, for this file to own.
#
# `IMAGE_TAG` defaults to `local` so `docker compose build` works
# out of the box for a manual smoke test; the pipeline overrides it with the
# commit SHA before build/push so every pushed image is traceable to the
# commit that produced it, and that same tag is passed to Render's deploy
# hook as `imgURL` so a deploy names the exact artifact it deploys.
#
# Judgement call on `ports:` / `restart:` — kept, not dropped. In the
# pipeline's own use (`build` then `push`) they are inert: Compose ignores
# them for both commands. They are kept because this file remains useful for
# a second purpose neither Render nor the pipeline provide — running
# `docker compose -f docker/docker-compose.stage.yml up` locally, against the
# exact images about to be pushed, as a pre-push smoke test. Dropping them
# would save nothing in the pipeline and would remove that capability, and
# it would make this the only compose file under `docker/` without a runnable
# shape, inconsistent with docker-compose.dev.yml and docker-compose.e2e.yml.
#
# `name`: see the equivalent note in docker-compose.dev.yml.
# ===================================
name: sport-itsm-stage

services:
  api:
    image: ghcr.io/igomez-ai4devs-projects/sport-itsm-api:${IMAGE_TAG:-local}
    build:
      context: .. # Context from docker/ to the project root.
      dockerfile: docker/backend/Dockerfile
    container_name: sport-itsm-api-stage
    ports:
      - '${PORT:-3300}:${PORT:-3300}'
    environment:
      # NODE_ENV/PORT plus PERSISTENCE_MODE (ADR-015, T-C10-76) — see the
      # equivalent note in docker-compose.dev.yml for why all three are
      # mandatory in env.validation.ts. Render itself sets these by hand in
      # the dashboard — this block only serves the local smoke-test path
      # described above.
      #
      # PERSISTENCE_MODE is the literal `memory`, not `${…:-memory}`: this is
      # the one file that models the real stage topology for a local
      # `docker compose up` dry run (ADR-015 — two Render services, no
      # database), so the value must be the actual stage value, not an
      # overridable default.
      - NODE_ENV=${NODE_ENV:-staging}
      - PORT=${PORT:-3300}
      - PERSISTENCE_MODE=memory
    healthcheck:
      # TCP-only — see docker/backend/Dockerfile.dev for why an HTTP probe
      # against a health path is not honest today.
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('net').createConnection({port:process.env.PORT||3300},()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - stage-network

  web:
    image: ghcr.io/igomez-ai4devs-projects/sport-itsm-web:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    container_name: sport-itsm-web-stage
    ports:
      - '4200:80'
    environment:
      # nginx reverse-proxies /api/ to the API service, same origin, no CORS
      # (ADR-015 decision 4, T-C10-79). Render sets this by hand on the web
      # service's own dashboard entry to the API service's public Render
      # URL — this entry only serves the local `docker compose up`
      # smoke-test path described above. Origin only: no path, no trailing
      # slash (docker/frontend/docker-entrypoint.d/10-check-api-upstream-url.sh
      # rejects the container start otherwise).
      - API_UPSTREAM_URL=http://api:3300
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - stage-network

networks:
  stage-network:
    driver: bridge
