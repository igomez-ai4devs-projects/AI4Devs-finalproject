# Sport ITSM — shared response security headers (T-C10-79 header-inheritance
# fix). Not part of the envsubst template: this file has no `${...}`
# placeholder, so docker/frontend/Dockerfile COPYs it statically to
# /etc/nginx/security-headers.conf instead of routing it through
# /etc/nginx/templates/.
#
# Why a separate include instead of three `add_header` lines repeated by
# hand: nginx's `add_header` is not additive across levels — a location
# block that declares its own `add_header` (as the cached-assets, index.html
# and /health locations in nginx.conf.template do) REPLACES the ones
# inherited from `server`, it does not merge with them. `include`ing this
# same file at `server` level and again inside every location that sets its
# own `add_header` keeps the three headers on every response point from one
# place, so a future header change happens exactly once instead of once per
# location.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
